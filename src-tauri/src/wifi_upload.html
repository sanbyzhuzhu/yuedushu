<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>阅读树 · Wi-Fi 传书</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f6f1e6;color:#302b25;font:16px/1.7 system-ui,sans-serif}main{max-width:640px;margin:40px auto;padding:24px}h1{font:600 28px/1.4 Georgia,serif;margin-bottom:8px}p{color:#6c6357}section{border-top:1px solid #d5cbbb;padding:22px 0}label{display:block;margin:12px 0}input[type=text]{width:100%;padding:12px;border:1px solid #c7baa5;background:#fffdf7;border-radius:6px;font:inherit;letter-spacing:.18em}input[type=file]{max-width:100%;margin:12px 0}button{font:inherit;cursor:pointer;padding:10px 18px;border:0;border-radius:6px;background:#ab3f32;color:white}button:disabled{opacity:.5;cursor:default}.hint{font-size:14px}.item{padding:12px 0;border-bottom:1px solid #ddd2bf;overflow-wrap:anywhere}.item strong{display:block}.error{color:#a53027}progress{width:100%;accent-color:#ab3f32}[hidden]{display:none!important}#status{overflow-wrap:anywhere}@media(max-width:480px){main{margin:10px auto;padding:20px}}
</style></head><body><main><h1>阅读树 · Wi-Fi 传书</h1><p>同一局域网，选几本书，送进书架。</p><section id="pair"><label for="code">输入阅读树上显示的 8 位配对码</label><input id="code" type="text" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="8 位配对码"><button id="connect" type="button">连接阅读树</button></section><section id="send" hidden><label for="books">选择电子书（可多选，单本最多 256 MiB）</label><input id="books" type="file" multiple accept=".epub,.txt,.md,.markdown,.pdf,.docx,.mobi,.azw,.azw3,.prc,.fb2,.zip,.cbz,.updb,.ofd,.odt,.html,.htm,.xhtml"><button id="upload" type="button" disabled>上传并入架</button><p class="hint">请保持接收设备上的阅读树在前台。上传完成后仍需整理入架，以下方“已入架”为准；不需要上传整个书库。</p><div id="results" aria-live="polite"></div></section><p id="status" role="status"></p><p class="hint">只在你开启的传书会话中接收文件。此页面不提供查看或下载现有藏书的功能。</p></main><script>
(()=>{'use strict';let token='',busy=false;const $=id=>document.getElementById(id),status=text=>{$('status').textContent=text;};
function describe(error){return error instanceof TypeError?'连接已断开，请在阅读树查看入架结果，避免重复上传。':error.message||'请求未完成，请重试。';}
async function json(response){let value;try{value=await response.json();}catch{throw Error('阅读树未返回有效响应，请检查是否已关闭传书。');}if(!response.ok)throw Error(value.error||'请求失败');return value;}
$('connect').onclick=async()=>{const code=$('code').value.trim();if(!/^\d{8}$/.test(code)){status('请填写 8 位配对码');return;}$('connect').disabled=true;try{const result=await json(await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})}));token=result.token;$('pair').hidden=true;$('send').hidden=false;status('已连接，可选择电子书上传。');}catch(e){status(describe(e));}finally{$('connect').disabled=false;}};
$('books').onchange=()=>{$('upload').disabled=busy||!$('books').files.length;};
function send(file,progress){return new Promise((resolve,reject)=>{const request=new XMLHttpRequest();request.open('POST','/upload?name='+encodeURIComponent(file.name));request.setRequestHeader('Authorization','Bearer '+token);request.setRequestHeader('Content-Type','application/octet-stream');request.timeout=900000;request.upload.onprogress=e=>{if(e.lengthComputable){progress.value=e.loaded;progress.max=e.total;}};request.onerror=()=>reject(Error('连接中断，请保持同一网络并确认阅读树仍在接收。'));request.ontimeout=()=>reject(Error('上传超时，请重试。'));request.onload=()=>{try{const data=JSON.parse(request.responseText);if(request.status<200||request.status>=300)throw Error(data.error||'上传失败');resolve(data.id);}catch(e){reject(e);}};request.send(file);});}
async function waitForImport(id,label){for(let n=0;n<600;n++){const value=await json(await fetch('/status',{headers:{Authorization:'Bearer '+token},cache:'no-store'}));const file=value.transfers.find(item=>item.id===id);if(file?.status==='imported'){label.textContent=file.message||'已入架';return;}if(file?.status==='failed')throw Error(file.message||'入架失败');label.textContent='上传完成，阅读树正在整理入架…';await new Promise(resolve=>setTimeout(resolve,1000));}throw Error('等待入架超时，请在阅读树中查看接收结果，避免重复上传。');}
$('upload').onclick=async()=>{if(busy||!token)return;const files=Array.from($('books').files);busy=true;$('upload').disabled=true;$('books').disabled=true;let done=0;for(const file of files){const row=document.createElement('div');row.className='item';const name=document.createElement('strong');name.textContent=file.name;const label=document.createElement('span');label.textContent='正在上传…';const progress=document.createElement('progress');progress.max=file.size||1;progress.value=0;row.append(name,progress,label);$('results').append(row);try{if(!file.size||file.size>268435456)throw Error('请选择非空且不超过 256 MiB 的电子书。');const id=await send(file,progress);await waitForImport(id,label);done++;}catch(e){label.textContent=describe(e);label.className='error';}finally{progress.remove();}}busy=false;$('books').disabled=false;$('books').value='';status('本次已入架 '+done+' / '+files.length+' 本，可返回阅读树查看。');};
})();
</script></body></html>
